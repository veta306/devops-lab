name: CI Static Web Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install HTML Validator
        run: npm install -g html-validator-cli

      - name: Validate HTML file
        run: html-validator --file=index.html --is-local
        